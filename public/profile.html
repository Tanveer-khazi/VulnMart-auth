<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Profile &middot; VulnMart Auth</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="banner">FOR AUTHORIZED SECURITY EDUCATION ONLY &mdash; DO NOT DEPLOY PUBLICLY</div>
<header class="site">
  <a class="brand" href="/">VulnMart Auth</a>
  <nav class="site" id="site-nav"></nav>
</header>
<main>
  <div class="card">
    <h1>Your profile</h1>
    <pre id="profile-json">Loading...</pre>

    <h1>Update profile</h1>
    <form id="update-form">
      <label for="patch">Raw JSON patch (sent as-is to PATCH /api/auth/profile)</label>
      <textarea id="patch" rows="4">{"name": "Updated Name"}</textarea>
      <button type="submit">Send update</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="hint">
      This form sends whatever JSON you type directly to the profile-update
      endpoint, on purpose &mdash; it's here so you can try things like
      <code>{"role": "admin"}</code> against your own account.
    </p>
  </div>
</main>
<script src="/js/api.js"></script>
<script>
async function loadProfile() {
  const pre = document.getElementById('profile-json');
  try {
    const me = await API.request('/api/auth/me');
    pre.textContent = JSON.stringify(me, null, 2);
  } catch (err) {
    pre.textContent = 'Not logged in.';
    if (err.status === 401) window.location.href = '/login.html';
  }
}

document.getElementById('update-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  let payload;
  try {
    payload = JSON.parse(document.getElementById('patch').value);
  } catch (err) {
    showMessage(msg, 'Invalid JSON', 'error');
    return;
  }
  try {
    const updated = await API.request('/api/auth/profile', {
      method: 'PATCH',
      body: JSON.stringify(payload),
    });
    showMessage(msg, `Updated: ${JSON.stringify(updated)}\n\nLog out and back in (or hit /api/auth/login again) to get a fresh JWT reflecting any role change.`, 'ok');
    loadProfile();
  } catch (err) {
    showMessage(msg, err.message, 'error');
  }
});

loadProfile();
</script>
</body>
</html>
